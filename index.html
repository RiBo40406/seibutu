<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>生物学 予想マークテスト・ランダム演習</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6f8;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
header{background:#16324f;color:#fff;padding:20px 16px}
header h1{margin:0;font-size:20px}
header p{margin:7px 0 0;opacity:.9;font-size:12px;line-height:1.5}
main{max-width:700px;margin:auto;padding:12px}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #00000012}
.progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.progressbar{height:7px;background:#e5e7eb;border-radius:99px;overflow:hidden}
.progressbar span{display:block;height:100%;background:#2563eb;transition:.2s}
.badge{display:inline-block;background:#e8f1ff;color:#1859a9;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:700;margin-right:5px}
.question{font-size:17px;line-height:1.65;margin:10px 0 14px;font-weight:700}
.option{display:block;border:1px solid #d8e0e6;border-radius:11px;padding:12px;margin:8px 0;cursor:pointer;line-height:1.5}
.option input{margin-right:8px;transform:scale(1.15)}
.option.selected{border-color:#2563eb;background:#eef5ff}
button{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;background:#2563eb;color:#fff;margin:7px 0}
button.secondary{background:#64748b}
.resultbox{border-radius:12px;padding:13px;margin-top:12px;line-height:1.7}
.ok{background:#ecfdf3;border:1px solid #a7f3d0;color:#075e3c}
.ng{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239}
.explain{font-size:14px;line-height:1.75;background:#f5f7f9;border-radius:11px;padding:13px;margin-top:12px}
.why{background:#fff;border-radius:9px;padding:10px;margin-top:9px}
.ref{font-size:11px;color:#5d6b78;margin-top:10px}
.ref a{color:#1459a6}
.visual{margin:10px 0;border-radius:12px;overflow:hidden;border:1px solid #dde4ea;background:#fafafa}
.visual img{display:block;width:100%;max-height:300px;object-fit:contain}
.visual figcaption{padding:6px 9px;font-size:10px;color:#607080}
.diagram{background:#fff;border:1px solid #dbe3e8;border-radius:12px;padding:12px;margin-top:10px}
.diagram-title{font-size:12px;font-weight:800;margin-bottom:8px}
.flow{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.node{padding:8px 9px;border-radius:9px;background:#eef5ff;border:1px solid #bcd3f5;text-align:center;font-size:12px}
.arrow{font-weight:800;color:#64748b}
.small{font-size:12px;color:#64748b;line-height:1.6}
.wrong-item{border-top:1px solid #e5e7eb;padding:12px 0}
.score{font-size:30px;text-align:center;font-weight:800;margin:5px}
</style>
</head>
<body>
<header>
<h1>生物学 予想マークテスト</h1>
<p>授業プリント（第7〜14回）を中心に、内容を検証して作成したランダム演習</p>
</header>
<main>
<div class="card">
  <div class="progress">
    <b id="count">第1問 / 20問</b>
    <span class="small" id="cat"></span>
  </div>
  <div class="progressbar"><span id="bar" style="width:5%"></span></div>
</div>
<section class="card" id="quizCard">
  <div id="quiz"></div>
  <button id="answerBtn" onclick="answer()">回答する</button>
  <div id="feedback"></div>
  <button id="nextBtn" onclick="nextQuestion()" style="display:none">次の問題へ</button>
</section>
<section class="card" id="final" style="display:none"></section>
</main>
<script>
const bank=[{"q":"次のうち、原核生物に分類されるものを1つ選べ。","o":["アメーバ","ゾウリムシ","細菌","ミドリムシ"],"a":2,"e":"原核生物は核膜に囲まれた核をもたず、細菌などが該当します。","cat":"分類","details":["① アメーバは原生生物です。","② ゾウリムシは原生生物です。","③ 細菌は原核生物です。","④ ミドリムシは原生生物です。"],"src":0,"img":"生物の分類の授業プリント","sourceName":"文部科学省・生物基礎 教科書資料（植生・バイオーム・生態系）","sourceUrl":"https://www.mext.go.jp/component/a_menu/education/micro_detail/__icsFiles/afieldfile/2016/05/19/1371016_3_1.pdf"},{"q":"次のうち、真核生物に分類されるものを1つ選べ。","o":["大腸菌","乳酸菌","ミドリムシ","納豆菌"],"a":2,"e":"真核生物は核膜に囲まれた核をもちます。ミドリムシは真核生物です。","cat":"分類","details":["① 大腸菌は細菌で原核生物です。","② 乳酸菌は細菌で原核生物です。","③ ミドリムシは真核生物です。","④ 納豆菌は細菌で原核生物です。"],"src":0,"img":"生物の分類の授業プリント","sourceName":"文部科学省・生物基礎 教科書資料（植生・バイオーム・生態系）","sourceUrl":"https://www.mext.go.jp/component/a_menu/education/micro_detail/__icsFiles/afieldfile/2016/05/19/1371016_3_1.pdf"},{"q":"被子植物の特徴として正しいものを1つ選べ。","o":["胚珠が子房に包まれている","種子をつくらない","必ず胞子だけでふえる","子房をもたない"],"a":0,"e":"被子植物では胚珠が子房に包まれ、受精後に種子になります。","cat":"分類","details":["① 正しいです。","② 被子植物は種子植物です。","③ 胞子だけでふえる植物ではありません。","④ 子房をもつことが被子植物の特徴です。"],"src":0,"img":"生物の分類の授業プリント","sourceName":"文部科学省・生物基礎 教科書資料（植生・バイオーム・生態系）","sourceUrl":"https://www.mext.go.jp/component/a_menu/education/micro_detail/__icsFiles/afieldfile/2016/05/19/1371016_3_1.pdf"},{"q":"シダ植物について正しいものを1つ選べ。","o":["種子でのみふえる","胞子をつくる","必ず花をつける","子房をもつ"],"a":1,"e":"シダ植物は種子をつくらず、胞子によってふえます。","cat":"分類","details":["① 種子植物ではありません。","② 正しいです。","③ 花をつくる植物ではありません。","④ 子房は被子植物の器官です。"],"src":0,"img":"生物の分類の授業プリント","sourceName":"文部科学省・生物基礎 教科書資料（植生・バイオーム・生態系）","sourceUrl":"https://www.mext.go.jp/component/a_menu/education/micro_detail/__icsFiles/afieldfile/2016/05/19/1371016_3_1.pdf"},{"q":"菌類について正しいものを1つ選べ。","o":["光合成で有機物をつくる","主に有機物を吸収して栄養を得る","必ず種子をつくる","すべて単細胞である"],"a":1,"e":"菌類は植物のように光合成するのではなく、外部の有機物を分解・吸収して栄養を得ます。","cat":"分類","details":["① 菌類は一般に光合成を行いません。","② 正しいです。","③ 種子をつくりません。","④ キノコなど多細胞の菌類もあります。"],"src":0,"img":"生物の分類の授業プリント","sourceName":"文部科学省・生物基礎 教科書資料（植生・バイオーム・生態系）","sourceUrl":"https://www.mext.go.jp/component/a_menu/education/micro_detail/__icsFiles/afieldfile/2016/05/19/1371016_3_1.pdf"},{"q":"「卵→幼虫→蛹→成虫」という発育をする昆虫を何というか。","o":["不完全変態をする昆虫","完全変態をする昆虫","変態しない昆虫","胞子でふえる昆虫"],"a":1,"e":"蛹の段階を経るのが完全変態です。","cat":"生活環","details":["① 不完全変態では蛹期を経ません。","② 正しいです。","③ 昆虫では発育に伴う変化がみられます。","④ 昆虫は胞子でふえる生物ではありません。"],"src":0,"img":"生活環の授業プリント","sourceName":"文部科学省・生物基礎 教科書資料（植生・バイオーム・生態系）","sourceUrl":"https://www.mext.go.jp/component/a_menu/education/micro_detail/__icsFiles/afieldfile/2016/05/19/1371016_3_1.pdf"},{"q":"トンボ類の発育として適切なものを1つ選べ。","o":["卵→幼虫→成虫","卵→幼虫→蛹→成虫","卵→蛹→成虫","卵→成虫"],"a":0,"e":"トンボ類は不完全変態で、蛹期を経ず、幼虫（ヤゴ）から成虫になります。","cat":"生活環","details":["① 正しいです。","② 蛹期を経ません。","③ トンボには蛹期がありません。","④ 幼虫期があります。"],"src":0,"img":"生活環の授業プリント","sourceName":"文部科学省・生物基礎 教科書資料（植生・バイオーム・生態系）","sourceUrl":"https://www.mext.go.jp/component/a_menu/education/micro_detail/__icsFiles/afieldfile/2016/05/19/1371016_3_1.pdf"},{"q":"完全変態と不完全変態の違いとして最も適切なものを1つ選べ。","o":["完全変態では蛹期がある","不完全変態では幼虫期がない","完全変態では卵をつくらない","不完全変態では成虫にならない"],"a":0,"e":"完全変態では幼虫と成虫の間に蛹期があります。","cat":"生活環","details":["① 正しいです。","② 不完全変態にも幼虫期があります。","③ 卵から発生します。","④ 成虫になります。"],"src":0,"img":"生活環の授業プリント","sourceName":"文部科学省・生物基礎 教科書資料（植生・バイオーム・生態系）","sourceUrl":"https://www.mext.go.jp/component/a_menu/education/micro_detail/__icsFiles/afieldfile/2016/05/19/1371016_3_1.pdf"},{"q":"生活史について正しいものを1つ選べ。","o":["発生段階ごとの生活場所や食物の違いを含めて考える","成体の形だけを調べる","遺伝子だけを調べる","必ず一つの環境だけで一生を過ごす"],"a":0,"e":"生活史は、発生・成長に伴う生活様式の変化を含めて捉えます。","cat":"生活環","details":["① 正しいです。","② 成体だけでは生活史全体を説明できません。","③ 遺伝子だけを意味しません。","④ 発生段階によって環境が変わる生物もいます。"],"src":0,"img":"生活環の授業プリント","sourceName":"文部科学省・生物基礎 教科書資料（植生・バイオーム・生態系）","sourceUrl":"https://www.mext.go.jp/component/a_menu/education/micro_detail/__icsFiles/afieldfile/2016/05/19/1371016_3_1.pdf"},{"q":"海産無脊椎動物の幼生について正しいものを1つ選べ。","o":["幼生が浮遊して分散する種類がある","すべて成体と同じ形で生まれる","すべて一生固着生活をする","幼生は成長しない"],"a":0,"e":"海産無脊椎動物には、幼生期に浮遊して分散し、成長すると別の生活様式になるものがあります。","cat":"生活環","details":["① 正しいです。","② 幼生と成体の形が異なるものもあります。","③ すべてが固着生活ではありません。","④ 幼生は成長・変態します。"],"src":0,"img":"生活環の授業プリント","sourceName":"文部科学省・生物基礎 教科書資料（植生・バイオーム・生態系）","sourceUrl":"https://www.mext.go.jp/component/a_menu/education/micro_detail/__icsFiles/afieldfile/2016/05/19/1371016_3_1.pdf"},{"q":"ある昆虫が「卵→幼虫→蛹→成虫」と発育する。成虫と幼虫で食物が異なることの生態学的な利点として考えられるものを1つ選べ。","o":["幼虫と成虫の食物をめぐる競争を弱められる場合がある","必ず個体数が増える","必ず寿命が長くなる","すべての捕食者から逃げられる"],"a":0,"e":"発育段階で利用資源が異なると、同種内で同じ資源をめぐる競争を弱める場合があります。","cat":"生活環","details":["① 正しいです。","② 必ず増えるとは限りません。","③ 寿命が必ず長くなるわけではありません。","④ 捕食を完全に防ぐわけではありません。"],"src":0,"img":"生活環の授業プリント","sourceName":"文部科学省・生物基礎 教科書資料（植生・バイオーム・生態系）","sourceUrl":"https://www.mext.go.jp/component/a_menu/education/micro_detail/__icsFiles/afieldfile/2016/05/19/1371016_3_1.pdf"},{"q":"個体群とは何を指すか。","o":["同じ地域に生息する同種の個体の集まり","地球上のすべての生物","異なる種の生物を無作為に集めたもの","一個体の一生"],"a":0,"e":"個体群は、ある地域に生息する同種の個体の集まりです。","cat":"個体群","details":["① 正しいです。","② これは生物圏に近い考え方です。","③ 種間の集まりは群集など別の概念です。","④ 一個体の一生は個体群ではありません。"],"src":3,"img":"個体群・種間関係の授業プリント","sourceName":"文部科学省・生物基礎 教科書資料（植生・バイオーム・生態系）","sourceUrl":"https://www.mext.go.jp/component/a_menu/education/micro_detail/__icsFiles/afieldfile/2016/05/19/1371016_3_1.pdf"},{"q":"個体数が増えると、個体間の競争が強くなる。この現象を説明する語として適切なものを1つ選べ。","o":["密度効果","光合成","蒸散","遺伝子流動"],"a":0,"e":"個体密度が変化することで出生・死亡や競争などに影響が出ることを密度効果といいます。","cat":"個体群","details":["① 正しいです。","② 光エネルギーを利用して有機物をつくる反応です。","③ 植物から水が失われる現象です。","④ 集団間で遺伝子が移動する現象です。"],"src":3,"img":"個体群・種間関係の授業プリント","sourceName":"文部科学省・生物基礎 教科書資料（植生・バイオーム・生態系）","sourceUrl":"https://www.mext.go.jp/component/a_menu/education/micro_detail/__icsFiles/afieldfile/2016/05/19/1371016_3_1.pdf"},{"q":"個体群の個体数を変化させる要因の組合せとして正しいものを1つ選べ。","o":["出生・死亡・移入・移出","光合成・蒸散・呼吸・発酵","食物連鎖・遷移・擬態・共生","核分裂・減数分裂・受精・発生"],"a":0,"e":"個体数は出生・死亡に加えて、個体の移入・移出によっても変化します。","cat":"個体群","details":["① 正しいです。","② 個体数変化を直接表す4要因ではありません。","③ 生態系の別の概念です。","④ 発生・生殖に関する過程です。"],"src":3,"img":"個体群・種間関係の授業プリント","sourceName":"文部科学省・生物基礎 教科書資料（植生・バイオーム・生態系）","sourceUrl":"https://www.mext.go.jp/component/a_menu/education/micro_detail/__icsFiles/afieldfile/2016/05/19/1371016_3_1.pdf"},{"q":"標識再捕法で、最初に標識した個体が再捕獲された割合が高かった。このとき一般に推定される個体数はどうなるか。","o":["小さくなる","大きくなる","必ず0になる","判断できないので必ず同じになる"],"a":0,"e":"標識個体が再捕獲される割合が高いほど、最初に標識した個体が全体の中で占める割合が大きいと考えられ、推定個体数は小さくなる方向です。","cat":"個体群","details":["① 正しいです。","② 一般には逆方向です。","③ 0にはなりません。","④ 条件が適切なら推定できます。"],"src":3,"img":"個体群・種間関係の授業プリント","sourceName":"文部科学省・生物基礎 教科書資料（植生・バイオーム・生態系）","sourceUrl":"https://www.mext.go.jp/component/a_menu/education/micro_detail/__icsFiles/afieldfile/2016/05/19/1371016_3_1.pdf"},{"q":"標識再捕法を行う際、標識した個体をいったん放すのはなぜか。","o":["母集団に戻して、後の再捕獲で標識個体の割合を調べるため","標識を消すため","個体を必ず増やすため","捕食者を減らすため"],"a":0,"e":"標識個体を母集団に戻し、再捕獲時の標識個体の割合から全体の個体数を推定します。","cat":"個体群","details":["① 正しいです。","② 標識を消す目的ではありません。","③ 個体数を操作する方法ではありません。","④ 捕食者を減らす調査ではありません。"],"src":3,"img":"個体群・種間関係の授業プリント","sourceName":"文部科学省・生物基礎 教科書資料（植生・バイオーム・生態系）","sourceUrl":"https://www.mext.go.jp/component/a_menu/education/micro_detail/__icsFiles/afieldfile/2016/05/19/1371016_3_1.pdf"},{"q":"捕食者を除去したところ、被食者の個体数が回復した。この関係として最も適切なものを1つ選べ。","o":["捕食による種間関係","同種間競争","光合成","遷移"],"a":0,"e":"捕食者と被食者は異なる種の間の関係で、捕食者の存在が被食者の個体数に影響します。","cat":"種間関係","details":["① 正しいです。","② 同じ種同士の競争ではありません。","③ 光を利用した有機物生産の反応です。","④ 群集の時間的変化です。"],"src":3,"img":"個体群・種間関係の授業プリント","sourceName":"文部科学省・生物基礎 教科書資料（植生・バイオーム・生態系）","sourceUrl":"https://www.mext.go.jp/component/a_menu/education/micro_detail/__icsFiles/afieldfile/2016/05/19/1371016_3_1.pdf"},{"q":"異なる種が同じ食物を利用し、食物が不足した。この関係として適切なものを1つ選べ。","o":["種間競争","同化","光合成","変態"],"a":0,"e":"異なる種が同じ資源を利用することで競争が起こることがあります。","cat":"種間関係","details":["① 正しいです。","② 物質を体内に取り込む過程の用語です。","③ 光エネルギーを使う生産過程です。","④ 発生段階に伴う形態変化です。"],"src":3,"img":"個体群・種間関係の授業プリント","sourceName":"文部科学省・生物基礎 教科書資料（植生・バイオーム・生態系）","sourceUrl":"https://www.mext.go.jp/component/a_menu/education/micro_detail/__icsFiles/afieldfile/2016/05/19/1371016_3_1.pdf"},{"q":"ガラパゴス諸島のフィンチ類のように、くちばしの形などが食物資源に応じて異なる現象を説明する語として適切なものを1つ選べ。","o":["食い分け","完全変態","標識再捕法","遷移"],"a":0,"e":"同じ場所に近縁種が共存するとき、利用す function lessonFor(cat){
 const map={
  "分類":"第7〜8回「多様な生物の分類」",

  "生態系":"第12〜14回「生物群集・生物圏」",
  "総合":"第12〜14回「生物群集・生物圏」"
 };
 return map[cat]||"授業プリント範囲";
}
function diagramFor(x){
 const c=x.cat;
 if(c==="生活環") return `<div class="diagram"><div class="diagram-title">発育の流れ</div><div class="flow"><span class="node">卵</span><span class="arrow">→</span><span class="node">幼虫</span><span class="arrow">→</span><span class="node">蛹（ある場合）</span><span class="arrow">→</span><span class="node">成虫</span></div><div class="small">※トンボ類など不完全変態では蛹期を経ません。</div></div>`;
 if(c==="個体群") return `<div class="diagram"><div class="diagram-title">個体数の変化</div><div class="flow"><span class="node">出生</span><span class="arrow">＋</span><span class="node">移入</span><span class="arrow">−</span><span class="node">死亡</span><span class="arrow">−</span><span class="node">移出</span><span class="arrow">＝</span><span class="node">個体数の変化</span></div></div>`;
 if(c==="種間関係") return `<div class="diagram"><div class="diagram-title">資源利用と競争</div><div class="flow"><span class="node">同じ資源</span><span class="arrow">→</span><span class="node">資源をめぐる競争</span><span class="arrow">→</span><span class="node">すみわけ・食い分けで弱まる場合</span></div></div>`;
 if(c==="防御") return `<div class="diagram"><div class="diagram-title">擬態・防御の考え方</div><div class="flow"><span class="node">捕食者</span><span class="arrow">→</span><span class="node">発見・攻撃</span><span class="arrow">→</span><span class="node">隠蔽・防御形質</span></div></div>`;
 if(c==="遷移"||c==="陸上バイオーム") return `<div class="diagram"><div class="diagram-title">植生の変化（モデル）</div><div class="flow"><span class="node">荒原</span><span class="arrow">→</span><span class="node">草原</span><span class="arrow">→</span><span class="node">森林など</span></div><div class="small">土壌・光環境などの変化や気候条件によって成立する植生は異なります。</div></div>`;
 if(c==="海洋") return `<div class="diagram"><div class="diagram-title">深海の化学合成生態系</div><div class="flow"><span class="node">無機化合物</span><span class="arrow">→</span><span class="node">化学合成微生物<br>（生産者）</span><span class="arrow">→</span><span class="node">消費者</span><span class="arrow">→</span><span class="node">高次消費者</span></div></div>`;
 if(c==="生態系"||c==="物質循環") return `<div class="diagram"><div class="diagram-title">エネルギーの流れと物質循環</div><div class="flow"><span class="node">生産者</span><span class="arrow">→</span><span class="node">一次消費者</span><span class="arrow">→</span><span class="node">高次消費者</span></div><div class="small" style="text-align:center">エネルギー：一方向に流れ、各段階で一部が熱として失われる<br>物質：生物と環境の間を循環する</div></div>`;
 return "";
}
function makeTest(){
 current=shuffle(bank).slice(0,20).map(x=>({...x,o:x.o.slice(),a:x.a}));
 current.forEach(x=>{
  const pairs=x.o.map((text,i)=>({text,correct:i===x.a}));
  const s=shuffle(pairs); x.o=s.map(v=>v.text); x.a=s.findIndex(v=>v.correct);
 });
 let tries=0;
 while(tries++<400){
  const counts=[0,0,0,0]; current.forEach(x=>counts[x.a]++);
  if(Math.max(...counts)-Math.min(...counts)<=1) break;
  current.forEach(x=>{
   const pairs=x.o.map((text,i)=>({text,correct:i===x.a}));
   const s=shuffle(pairs); x.o=s.map(v=>v.text); x.a=s.findIndex(v=>v.correct);
  });
 }
 pos=0;score=0;mistakes=[];
 document.getElementById("final").style.display="none";
 renderQuestion(); window.scrollTo({top:0,behavior:"smooth"});
}
function renderQuestion(){
 const x=current[pos];
 document.getElementById("count").textContent=`第${pos+1}問 / ${current.length}`;
 document.getElementById("cat").textContent=lessonFor(x.cat);
 document.getElementById("bar").style.width=((pos+1)/current.length*100)+"%";
 const visual=x.img&&images[x.img]?`<figure class="visual"><img src="${images[x.img]}" alt="${x.img}"><figcaption>${x.img}（授業プリントの参考画像）</figcaption></figure>`:"";
 document.getElementById("quiz").innerHTML=`<div class="small"><span class="badge">${x.cat}</span></div><div class="question">${x.q}</div>${visual}${x.o.map((o,j)=>`<label class="option"><input type="radio" name="answer" value="${j}" onchange="selectOption(this)">${LABELS[j]} ${o}</label>`).join("")}`;
 document.getElementById("feedback").innerHTML="";
 document.getElementById("answerBtn").style.display="block";
 document.getElementById("nextBtn").style.display="none";
}
function selectOption(el){
 document.querySelectorAll(".option").forEach(e=>e.classList.remove("selected"));
 el.closest(".option").classList.add("selected");
}
function answer(){
 const x=current[pos],checked=document.querySelector('input[name="answer"]:checked');
 if(!checked){alert("選択肢を1つ選んでください。");return}
 const chosen=Number(checked.value),correct=chosen===x.a;
 if(correct) score++; else mistakes.push({x,chosen,index:pos});
 document.querySelectorAll('input[name="answer"]').forEach(e=>e.disabled=true);
 document.getElementById("answerBtn").style.display="none";
 const status=correct?`<div class="resultbox ok"><b>正解 ✓</b><br>よくできています。</div>`:`<div class="resultbox ng"><b>不正解 ✗</b><br>正解は ${LABELS[x.a]}「${x.o[x.a]}」です。</div>`;
 document.getElementById("feedback").innerHTML=status+`<div class="explain"><b>解説</b><br>${x.e}${diagramFor(x)}<div class="why"><b>選択肢の確認</b><br>${x.details.join("<br>")}</div><div class="ref"><b>この問題の範囲：</b>${lessonFor(x.cat)}<br><b>根拠：</b><a href="${x.sourceUrl}" target="_blank" rel="noopener">${x.sourceName}</a></div></div>`;
 document.getElementById("nextBtn").style.display="block";
 document.getElementById("nextBtn").textContent=pos===current.length-1?"結果を見る":"次の問題へ";
 window.scrollTo({top:0,behavior:"smooth"});
}
function nextQuestion(){if(pos<current.length-1){pos++;renderQuestion();}else showFinal();}
function showFinal(){
 const r=document.getElementById("final"); r.style.display="block";
 let wrong="";
 if(!mistakes.length) wrong=`<div class="resultbox ok"><b>全問正解！</b><br>今回の20問はすべて正解です。</div>`;
 else wrong=`<h3>間違えた問題</h3>`+mistakes.map(m=>`<div class="wrong-item"><b>第${m.index+1}問</b> <span class="badge">${m.x.cat}</span><div class="small">${lessonFor(m.x.cat)}</div><div style="margin-top:6px"><b>${m.x.q}</b></div><div style="margin-top:5px">あなたの回答：${LABELS[m.chosen]} ${m.x.o[m.chosen]}<br>正解：${LABELS[m.x.a]} ${m.x.o[m.x.a]}</div><div class="explain"><b>要点：</b>${m.x.e}${diagramFor(m.x)}<div class="ref"><b>根拠：</b><a href="${m.x.sourceUrl}" target="_blank" rel="noopener">${m.x.sourceName}</a></div></div></div>`).join("");
 r.innerHTML=`<div class="score">${score} / ${current.length}</div><p style="text-align:center"><b>${Math.round(score/current.length*100)}%</b></p>${wrong}<button onclick="makeTest()">もう一度20問やる</button>`;
 r.scrollIntoView({behavior:"smooth",block:"start"});
}
makeTest();
</script></body>
</html>
